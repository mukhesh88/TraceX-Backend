server:
  port: 8080

spring:
  application:
    name: tracex-backend

  datasource:
    url: jdbc:h2:mem:tracexdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

tracex:
  model:
    path: classpath:model/model.onnx

logging:
  level:
    root: INFO
    com.tracex: DEBUG
